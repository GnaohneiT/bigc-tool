*{box-sizing:border-box}

.full{grid-column:1/-1}
.vlink{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;background:#111;color:#fff;text-decoration:none;text-align:center;font-weight:600}
.vlink div{font-size:15px}.vlink:hover{background:var(--ac)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 0}
footer a{color:var(--mut)}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:80px;resize:vertical}
input[type=text],input[type=password],input[type=url],select{width:100%}
button{cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.sm{padding:4px 9px;font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 6px;font-size:18px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-top:8px}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tag{font-size:11px;background:var(--ac);color:#fff;border-radius:6px;padding:1px 6px;margin-right:6px}
.login{max-width:340px;margin:80px auto}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.card .pic{display:block;width:100%;height:auto;cursor:zoom-in;background:#000}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:18px;text-align:center;color:var(--mut);cursor:pointer}
.drop.on{border-color:var(--ac);color:var(--ac)}
.prev{margin-top:8px}
.prev img{max-width:100%;max-height:220px;border-radius:8px;display:block}
</style>
</head>
