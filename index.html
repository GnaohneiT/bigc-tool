function readTheme(){var g=function(i){return $(i).value},t={};

 ["r","w","gap","ts"].forEach(function(k){$("v_"+k).textContent=t[k]});
 S.settings.t=t;applyTheme();if($("tprev"))$("tprev").innerHTML=heroInner()}

 ["r","w","gap","ts"].forEach(function(k){$("v_"+k).textContent=$("t_"+k).value});
 document.querySelectorAll('[id^="t_"]').forEach(function(el){el.addEventListener("input",readTheme);el.addEventListener("change",readTheme)});
 document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){var p=b.dataset.p;if(p==="auto"){$("t_c").checked=false}else{var P=PRE[p];$("t_c").checked=true;$("t_bg").value=P.bg;$("t_card").value=P.card;$("t_tx").value=P.tx;$("t_ac").value=P.ac;$("t_g").checked=!!P.bg2;if(P.bg2)$("t_bg2").value=P.bg2;$("t_r").value=P.r;$("t_sh").value=P.sh;$("t_bw").value=String(P.bw);if(P.tfx)$("t_tfx").value=P.tfx;if(P.tfont)$("t_tfont").value=P.tfont;if(P.ts)$("t_ts").value=P.ts;$("t_wave").checked=true;$("t_fx").checked=true;$("t_fly").checked=true}readTheme()}});
 $("saveT").onclick=function(){readTheme();save()};

 var e=editing!==null?S.blocks.filter(function(b){return b.id===editing})[0]:null;

 h+='<div class="panel"><h2>'+(editing!==null?'Sửa khối':'Thêm khối mới')+'</h2><div class="cols2"><div><label>Loại</label><select id="b_type"><option value="video">Video YouTube</option><option value="image">Ảnh</option><option value="text">Văn bản</option></select></div><div><label>Chiếm cả hàng</label><select id="b_full"><option value="0">Không</option><option value="1">Có</option></select></div></div><div id="urlBox"><label>Link YouTube</label><input type="url" id="b_url" placeholder="https://www.youtube.com/watch?v=..." value="'+esc(e.url)+'"></div><div id="imgBox"><label>Chọn ảnh từ máy tính hoặc điện thoại</label><input type="file" id="b_file" accept="image/*"><img id="b_prev" alt="" style="display:none;max-width:100%;max-height:200px;margin-top:8px;border-radius:8px"></div><label>Tiêu đề</label><input type="text" id="b_title" value="'+esc(e.title)+'"><label>Nội dung / mô tả</label><textarea id="b_text">'+esc(e.text)+'</textarea><div class="row" style="margin-top:12px"><button class="pri" id="saveB">'+(editing!==null?'Cập nhật':'Thêm khối')+'</button>'+(editing!==null?'<button id="cancel">Hủy</button>':'')+'</div><div class="hint" id="bmsg"></div></div>';
 h+='<div class="panel"><h2>Danh sách khối ('+S.blocks.length+')</h2>';
 S.blocks.forEach(function(b,i){h+='<div class="item"><span><span class="tag">'+(b.type==="video"?"VIDEO":b.type==="image"?"ẢNH":"TEXT")+'</span>'+esc(b.title||b.url||"(không tiêu đề)")+'</span><div class="row"><button class="sm" data-a="up" data-i="'+i+'">↑</button><button class="sm" data-a="dn" data-i="'+i+'">↓</button><button class="sm" data-a="ed" data-i="'+b.id+'">Sửa</button><button class="sm" data-a="del" data-i="'+i+'">'+(pend===i?"Bấm lần nữa để xóa":"Xóa")+'</button></div></div>'});
 h+='</div>';
 h+='<div class="panel"><h2>Sao lưu / khôi phục</h2><div class="hint">Dữ liệu được lưu trong trình duyệt này. Sao chép đoạn dưới để sao lưu, hoặc dán dữ liệu cũ vào rồi bấm Khôi phục.</div><textarea id="bk" style="margin-top:8px;min-height:100px">'+esc(JSON.stringify(S))+'</textarea><div class="row" style="margin-top:8px"><button id="rest">Khôi phục</button><button id="reset">Đặt lại mặc định</button></div></div>';

 $("s_cols").value=String(s.cols);$("s_embed").value=s.embed?"1":"0";bindTheme();$("b_type").value=e.type;$("b_full").value=e.full?"1":"0";
