<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&family=Playfair+Display:wght@900&family=Lobster&display=swap" rel="stylesheet">
<title>Trang web của tôi</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#e3e6ec;--ac:#e5322d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e222b;--tx:#eceef2;--mut:#98a0b0;--bd:#2d3340}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e222b;--tx:#eceef2;--mut:#98a0b0;--bd:#2d3340}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bgfull,var(--bg));background-attachment:fixed;color:var(--tx);font:16px/1.6 var(--ff,system-ui,sans-serif);min-height:100vh}
.wrap{max-width:var(--w,1000px);margin:0 auto;padding:20px}
header.hero{position:relative;padding:40px 0 24px;text-align:var(--al,center)}
.wrap{position:relative;z-index:1}
.dwrap{position:relative;max-width:1000px;margin:0 auto;aspect-ratio:1000/352}
.dwrap>svg,.dwrap>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,122,24,.55));animation:dfloat 6s ease-in-out infinite alternate}
.dtitle{position:absolute;left:13%;right:13%;top:50%;transform:translateY(-50%);text-align:center}
.dtitle .ttl{font-size:min(var(--ts,40px),7vw)}
.dtitle .orn{justify-content:center}
.hbn{position:relative;max-width:1000px;margin:0 auto;text-align:center}
.hbg{position:absolute;inset:-20px 0 0 0;background-size:cover;background-position:center 30%;filter:blur(36px) saturate(1.3);opacity:.5;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.hfg{position:relative;display:block;margin:0 auto;width:min(86%,430px);aspect-ratio:415/520;object-fit:cover;object-position:center 10%;-webkit-mask-image:radial-gradient(ellipse 50% 52% at 50% 46%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 50% 52% at 50% 46%,#000 62%,transparent 100%);animation:dfloat 6s ease-in-out infinite alternate}
.dtitle2{position:relative;margin-top:-56px;padding:0 4%}
.dtitle2 .ttl{filter:drop-shadow(0 2px 10px rgba(0,0,0,.85))}
.dtitle2 .orn{justify-content:center}
.flame{transform-box:fill-box;transform-origin:0 50%;animation:fl .5s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(.85,.9)}to{transform:scale(1.12,1.05)}}
@keyframes dfloat{to{transform:translateY(-5px)}}
@media(max-width:700px){.dwrap{aspect-ratio:auto}.dwrap>svg,.dwrap>img{position:relative;display:block;height:auto}.dtitle{position:static;transform:none;padding:0 4%}.dtitle .ttl{font-size:min(var(--ts,40px),10vw)}}
@media (prefers-reduced-motion:reduce){.dwrap>svg,.dwrap>img,.flame{animation:none!important}}
.ttl{margin:0 0 8px;font-family:var(--tf,inherit);font-weight:700;font-size:min(var(--ts,40px),10vw);line-height:1.25;letter-spacing:.5px;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ac) 50%,transparent))}
.wd{display:inline-block;white-space:nowrap}
.ch{display:inline-block}
.ttl.fx-none .ch{color:var(--ac)}
.ttl.fx-rainbow .ch,.ttl.fx-gold .ch{background-size:400% 100%;background-position:0 0;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:flow 5s linear infinite;animation-delay:calc(var(--i)*-.12s)}
.ttl.fx-rainbow .ch{background-image:linear-gradient(90deg,var(--ac),#ff7a18,#ffd200,#22d3ee,#7c5cff,#ff4f9a,var(--ac))}
.ttl.fx-gold .ch{background-image:linear-gradient(90deg,#9a6400,#ffd700,#fff7c8,#ffd700,#9a6400)}
.ttl.fx-rainbow .ch.wv,.ttl.fx-gold .ch.wv{animation-name:flow,bob;animation-duration:5s,2.4s;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite;animation-delay:calc(var(--i)*-.12s),calc(var(--i)*-.2s)}
.ttl.fx-neon{animation:glow 2.4s ease-in-out infinite alternate}
.ttl.fx-neon .ch{color:#fff;text-shadow:0 0 6px var(--ac),0 0 16px var(--ac),0 0 34px var(--ac)}
.ttl.fx-neon .ch.wv,.ttl.fx-none .ch.wv{animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.2s)}
header.hero p{margin:0;color:var(--mut);letter-spacing:.08em;font-size:1.05rem;animation:rise .9s ease both}
.orn{display:flex;align-items:center;justify-content:var(--jc,center);gap:12px;margin-top:14px}
.orn i{display:block;width:90px;height:2px;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
.orn b{color:var(--ac);text-shadow:0 0 10px var(--ac);animation:pulse 2s ease-in-out infinite}
.sp{position:absolute;color:var(--ac);pointer-events:none;opacity:0;animation:twinkle 4.5s ease-in-out infinite}
.card{transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 12px 32px color-mix(in srgb,var(--ac) 28%,transparent)}
body[data-fx="1"]::before,body[data-fx="1"]::after{content:"";position:fixed;width:55vmax;height:55vmax;border-radius:50%;filter:blur(40px);z-index:-1;pointer-events:none}
body[data-fx="1"]::before{left:-18vmax;top:-18vmax;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 32%,transparent),transparent 65%);animation:drift 18s ease-in-out infinite alternate}
body[data-fx="1"]::after{right:-18vmax;bottom:-18vmax;background:radial-gradient(circle,rgba(255,90,60,.22),transparent 65%);animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes flow{to{background-position:100% 0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-.14em) rotate(2deg)}}
@keyframes glow{from{filter:brightness(.9)}to{filter:brightness(1.3)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) translateY(0)}50%{opacity:.9;transform:scale(1) translateY(-12px)}}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.ch,.ttl,.sp,.orn b,body::before,body::after{animation:none!important}.sp{opacity:.6}}
.grid{display:grid;gap:var(--gap,16px);grid-template-columns:repeat(var(--cols),1fr)}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:var(--bw,1px) solid var(--bd);border-radius:var(--r,14px);box-shadow:var(--sh,none);overflow:hidden}
.card .body{padding:14px 16px}
.card h3{margin:0 0 6px;font-size:18px}
.card p{margin:0;white-space:pre-wrap;color:var(--mut)}
.video{aspect-ratio:16/9;background:#000}
.video iframe{width:100%;height:100%;border:0;display:block}
.full{grid-column:1/-1}
.pic{width:100%;display:block}
.vlink{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;background:#111;color:#fff;text-decoration:none;text-align:center;font-weight:600}
.vlink div{font-size:15px}.vlink:hover{background:var(--ac)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 0}
footer a{color:var(--mut)}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:80px;resize:vertical}
input[type=text],input[type=password],input[type=url],select{width:100%}
button{cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.sm{padding:4px 9px;font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 6px;font-size:18px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-top:8px}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tag{font-size:11px;background:var(--ac);color:#fff;border-radius:6px;padding:1px 6px;margin-right:6px}
.login{max-width:340px;margin:80px auto}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
</style>
</head>

 $("go").onclick=go;$("pw").onkeydown=function(e){if(e.key==="Enter")go()};$("back").onclick=function(){location.hash=""};
}

function admin(){
 if(!isOwner){location.hash="";return}
 theme();var s=S.settings;
 var h='<div class="row" style="justify-content:space-between;margin:10px 0 16px"><h1 style="margin:0;font-size:22px">Quản trị</h1><div class="row"><button id="view">Xem trang</button></div></div><div class="panel"><h2>Đăng lên hosting</h2><div class="hint">Sửa xong bấm Lưu, sau đó tải file mới và thay file index.html trên hosting của bạn. Người xem chỉ thấy nội dung khi file trên hosting được thay.</div><button class="pri" id="dl" style="margin-top:8px">Tải file index.html mới</button></div>';
 h+='<div class="panel"><h2>Cài đặt chung</h2><label>Tiêu đề</label><input type="text" id="s_title" value="'+esc(s.title)+'"><label>Mô tả</label><input type="text" id="s_sub" value="'+esc(s.subtitle)+'"><div class="cols2"><div><label>Số cột bố cục</label><select id="s_cols"><option value="1">1 cột</option><option value="2">2 cột</option><option value="3">3 cột</option></select></div></div><label>Chân trang</label><input type="text" id="s_foot" value="'+esc(s.footer)+'"><label>Cách hiển thị video</label><select id="s_embed"><option value="0">Nút mở YouTube (luôn hoạt động)</option><option value="1">Nhúng trực tiếp (cần host riêng)</option></select><div style="margin-top:12px"><button class="pri" id="saveS">Lưu cài đặt</button></div></div>';h+=themePanel();
 var e=editing!==null?S.blocks.filter(function(b){return b.id===editing})[0]:null;
 e=e||{type:"video",title:"",text:"",url:"",full:false};tmpImg=e.img||"";
 h+='<div class="panel"><h2>'+(editing!==null?'Sửa khối':'Thêm khối mới')+'</h2><div class="cols2"><div><label>Loại</label><select id="b_type"><option value="video">Video YouTube</option><option value="image">Ảnh</option><option value="text">Văn bản</option></select></div><div><label>Chiếm cả hàng</label><select id="b_full"><option value="0">Không</option><option value="1">Có</option></select></div></div><div id="urlBox"><label>Link YouTube</label><input type="url" id="b_url" placeholder="https://www.youtube.com/watch?v=..." value="'+esc(e.url)+'"></div><div id="imgBox"><label>Chọn ảnh từ máy tính hoặc điện thoại</label><input type="file" id="b_file" accept="image/*"><img id="b_prev" alt="" style="display:none;max-width:100%;max-height:200px;margin-top:8px;border-radius:8px"></div><label>Tiêu đề</label><input type="text" id="b_title" value="'+esc(e.title)+'"><label>Nội dung / mô tả</label><textarea id="b_text">'+esc(e.text)+'</textarea><div class="row" style="margin-top:12px"><button class="pri" id="saveB">'+(editing!==null?'Cập nhật':'Thêm khối')+'</button>'+(editing!==null?'<button id="cancel">Hủy</button>':'')+'</div><div class="hint" id="bmsg"></div></div>';
 h+='<div class="panel"><h2>Danh sách khối ('+S.blocks.length+')</h2>';
 S.blocks.forEach(function(b,i){h+='<div class="item"><span><span class="tag">'+(b.type==="video"?"VIDEO":b.type==="image"?"ẢNH":"TEXT")+'</span>'+esc(b.title||b.url||"(không tiêu đề)")+'</span><div class="row"><button class="sm" data-a="up" data-i="'+i+'">↑</button><button class="sm" data-a="dn" data-i="'+i+'">↓</button><button class="sm" data-a="ed" data-i="'+b.id+'">Sửa</button><button class="sm" data-a="del" data-i="'+i+'">'+(pend===i?"Bấm lần nữa để xóa":"Xóa")+'</button></div></div>'});
 h+='</div>';
 h+='<div class="panel"><h2>Sao lưu / khôi phục</h2><div class="hint">Dữ liệu được lưu trong trình duyệt này. Sao chép đoạn dưới để sao lưu, hoặc dán dữ liệu cũ vào rồi bấm Khôi phục.</div><textarea id="bk" style="margin-top:8px;min-height:100px">'+esc(JSON.stringify(S))+'</textarea><div class="row" style="margin-top:8px"><button id="rest">Khôi phục</button><button id="reset">Đặt lại mặc định</button></div></div>';
 $("app").innerHTML=h;
 $("s_cols").value=String(s.cols);$("s_embed").value=s.embed?"1":"0";bindTheme();$("b_type").value=e.type;$("b_full").value=e.full?"1":"0";
 function tg(){$("urlBox").style.display=$("b_type").value==="video"?"block":"none";$("imgBox").style.display=$("b_type").value==="image"?"block":"none"}tg();$("b_file").onchange=function(){var f=this.files[0];if(!f)return;readImg(f,function(d){tmpImg=d;$("b_prev").src=d;$("b_prev").style.display="block"})};if(tmpImg){$("b_prev").src=tmpImg;$("b_prev").style.display="block"}$("b_type").onchange=tg;
 $("view").onclick=function(){location.hash=""};$("dl").onclick=download;
 $("saveS").onclick=function(){s.title=$("s_title").value;s.subtitle=$("s_sub").value;s.cols=+$("s_cols").value;s.footer=$("s_foot").value;s.embed=$("s_embed").value==="1";save();admin()};
 $("saveB").onclick=function(){
  var t=$("b_type").value,u=$("b_url").value.trim();
  if(t==="video"&&!ytId(u)){$("bmsg").textContent="Link YouTube không hợp lệ";return}if(t==="image"&&!tmpImg){$("bmsg").textContent="Hãy chọn một ảnh";return}
  var o={type:t,title:$("b_title").value,text:$("b_text").value,url:t==="video"?u:"",img:t==="image"?tmpImg:"",full:$("b_full").value==="1"};
  if(editing!==null){S.blocks=S.blocks.map(function(b){return b.id===editing?Object.assign({id:b.id},o):b})}
  else{o.id=Date.now();S.blocks.push(o)}
  editing=null;save();admin();
 };
 if($("cancel"))$("cancel").onclick=function(){editing=null;admin()};
 document.querySelectorAll("[data-a]").forEach(function(btn){btn.onclick=function(){
  var a=btn.dataset.a,i=+btn.dataset.i;if(a!=="del")pend=null;
  if(a==="up"&&i>0){var t=S.blocks[i];S.blocks[i]=S.blocks[i-1];S.blocks[i-1]=t}
  if(a==="dn"&&i<S.blocks.length-1){var t2=S.blocks[i];S.blocks[i]=S.blocks[i+1];S.blocks[i+1]=t2}
  if(a==="del"){if(pend!==i){pend=i;admin();return}S.blocks.splice(i,1);pend=null}
  if(a==="ed"){editing=i;admin();window.scrollTo(0,0);return}
  save();admin();
 }});
 $("rest").onclick=function(){try{var d=JSON.parse($("bk").value);if(!d.settings||!d.blocks)throw 0;S=d;save();admin()}catch(x){toast("Dữ liệu không hợp lệ")}};
 $("reset").onclick=function(){if(!window._r){window._r=1;$("reset").textContent="Bấm lần nữa để xác nhận";return}S=JSON.parse(JSON.stringify(def));save();admin()};
}

function download(){var json=JSON.stringify(S).replace(/</g,"\\u003c");var out=SRC.replace(/(<script id="site-data" type="application\/json">)[\s\S]*?(<\/script>)/,function(m,x,y){return x+json+y});var b=new Blob([out],{type:"text/html"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="index.html";document.body.appendChild(a);a.click();a.remove()}
function route(){if(location.hash==="#admin")admin();else pub()}
window.addEventListener("hashchange",route);route();
isOwner=true;route();
</script></body></html>
